version: '3.8'

services:
  nginx:
    build: ./nginx
    ports:
      - "8085:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./kml_files:/usr/share/nginx/html/kml:ro
    networks:
      - sitrep-net

  db:
    image: postgis/postgis:16-3.4
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=sitrep_db
    networks:
      - sitrep-net
    # --- ADDED: Healthcheck to ensure the DB is ready ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sitrep_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./kml_files:/app/kml_files:ro
    depends_on:
      - db
    networks:
      - sitrep-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - sitrep-net

  # Ingests emergency radio chatter (text sources for now) and turns it into
  # map reports: extract -> geocode -> insert into the reports table.
  radio-worker:
    build: ./radio-worker
    depends_on:
      - db
    environment:
      # DB (shared with backend)
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=sitrep_db
      # Source: text inbox. Drop .txt files (one transmission each) into
      # ./radio-worker/inbox and they get processed and archived.
      - RADIO_SOURCE=text
      - TEXT_INBOX_DIR=/data/inbox
      - TEXT_ARCHIVE_DIR=/data/processed
      # To poll a public Mastodon scanner account instead, set RADIO_SOURCE=mastodon
      # and provide the instance + account (no API key needed):
      # - MASTODON_INSTANCE=https://mastodon.social
      # - MASTODON_ACCOUNT=someScanner@mastodon.social
      # Or poll one or more RSS/Atom feeds (set RADIO_SOURCE=rss). A Mastodon
      # account's RSS endpoint works here too:
      # - RSS_FEEDS=https://mastodon.social/@someScanner.rss,https://example.org/alerts.xml
      - POLL_INTERVAL=10
      # Extraction: Claude when a key is set, rules fallback otherwise.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Optional geocode bias so bare street names resolve to the right area,
      # e.g. GEOCODE_REGION_HINT="Portland, Oregon"
      - GEOCODE_REGION_HINT=${GEOCODE_REGION_HINT:-}
    volumes:
      - ./radio-worker:/app
      - ./radio-worker/inbox:/data/inbox
      - ./radio-worker/processed:/data/processed
    networks:
      - sitrep-net

networks:
  sitrep-net:
    driver: bridge

volumes:
  postgres_data:

